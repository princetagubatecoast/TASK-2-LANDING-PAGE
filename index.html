<!DOCTYPE html>
<html>
<head>
    <title>STLEY TECH SHOP - Login</title>
    <meta charset="UTF-8">
</head>
<body bgcolor="#E8DCC4" link="#5D4037" vlink="#8B4513" alink="#228B22">

<table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td align="center" height="100">
            <img src="logo.png" alt="STLEY TECH SHOP" width="250" height="100">
        </td>
    </tr>
</table>

<table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#2F4F2F">
    <tr>
        <td align="center">
            <h1><font face="Arial" color="#C3B091">STLEY TECH SHOP</font></h1>
            <p><font face="Arial" color="#F5F5DC" size="4">Premium Gaming Phones</font></p>
        </td>
    </tr>
</table>

<br><br><br>

<table width="500" cellpadding="20" cellspacing="0" border="0" bgcolor="#5D4037" align="center">
    <tr>
        <td align="center">
            <img src="login_banner.jpg" alt="Login" width="500" height="200">
            <br><br>
            <h2><font face="Arial" color="#C3B091">MEMBER LOGIN</font></h2>
            <p><font face="Arial" color="#F5F5DC" size="2">Enter your details to access the shop.</font></p>
            <br>
            <form action="shop.html" method="get">
                <table cellpadding="10" cellspacing="0" border="0">
                    <tr>
                        <td align="right"><font face="Arial" color="#F5F5DC">Email:</font></td>
                        <td><input type="email" name="email" size="30" placeholder="Enter email" required></td>
                    </tr>
                    <tr>
                        <td align="right"><font face="Arial" color="#F5F5DC">Password:</font></td>
                        <td><input type="password" name="pass" size="30" placeholder="Enter password" required></td>
                    </tr>
                    <tr>
                        <td align="right"><font face="Arial" color="#F5F5DC">Account:</font></td>
                        <td>
                            <select name="type" required>
                                <option value="">-- Select --</option>
                                <option value="customer">Customer</option>
                                <option value="member">Member</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><input type="checkbox" name="remember"> <font face="Arial" color="#F5F5DC" size="2">Remember me</font></td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center">
                            <br>
                            <input type="submit" value="LOGIN">
                            <input type="reset" value="CLEAR">
                        </td>
                    </tr>
                </table>
            </form>
            <br>
            <p><font face="Arial" color="#C3B091" size="2"><a href="forgot.html"><font color="#F5F5DC">Forgot password?</font></a></font></p>
            <p><font face="Arial" color="#C3B091" size="2"><a href="shop.html"><font color="#F5F5DC">Browse as Guest</font></a></font></p>
        </td>
    </tr>
</table>

<br><br><br>

<table width="100%" cellpadding="15" cellspacing="0" border="0" bgcolor="#2F4F2F">
    <tr>
        <td align="center">
            <p><font face="Arial" size="2" color="#C3B091">STLEY TECH SHOP 2026</font></p>
            <p><font face="Arial" size="2" color="#F5F5DC">By Prince Tagubat</font></p>
        </td>
    </tr>
</table>

</body>
</html>
