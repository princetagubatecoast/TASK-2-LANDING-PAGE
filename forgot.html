<table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#2F4F2F">

<table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#2F4F2F">

        <td align="center">
            <h1><font face="Arial" color="#C3B091">STLEY TECH SHOP</font></h1>
            <p><font face="Arial" color="#F5F5DC" size="4">Account Recovery</font></p>
        </td>
    </tr>

<br><br><br>

<table width="500" cellpadding="25" cellspacing="0" border="0" bgcolor="#5D4037" align="center">
    <tr>
        <td align="center">
            <h2><font face="Arial" color="#C3B091">RESET PASSWORD</font></h2>
            <p><font face="Arial" color="#F5F5DC" size="2">Enter your details to reset your password.</font></p>
            <br>
            <form action="index.html" method="get">
                <table cellpadding="12" cellspacing="0" border="0">
                    <tr>
                        <td align="right"><font face="Arial" color="#F5F5DC">Username:</font></td>
                        <td><input type="text" name="user" size="30" required></td>
                    </tr>
                    <tr>
                        <td align="right"><font face="Arial" color="#F5F5DC">Email:</font></td>
                        <td><input type="email" name="email" size="30" required></td>
                    </tr>
                    <tr>
                        <td align="right"><font face="Arial" color="#F5F5DC">Phone:</font></td>
                        <td><input type="tel" name="phone" size="30" required></td>
                    </tr>
                    <tr>
                        <td align="right"><font face="Arial" color="#F5F5DC">New Password:</font></td>
                        <td><input type="password" name="newpass" size="30" minlength="8" required></td>
                    </tr>
                    <tr>
                        <td align="right"><font face="Arial" color="#F5F5DC">Confirm:</font></td>
                        <td><input type="password" name="confirm" size="30" minlength="8" required></td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center">
                            <br>
                            <input type="submit" value="RESET PASSWORD">
                            <input type="reset" value="CLEAR">
                        </td>
                    </tr>
                </table>
            </form>
            <br>
            <p><font face="Arial" color="#C3B091" size="2"><a href="index.html"><font color="#F5F5DC">Back to Login</font></a></font></p>
        </td>
    </tr>
</table>
